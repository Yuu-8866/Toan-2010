<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quà 20/10 💐</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --pink: #ff4f81;
    --pink-2: #ff8fab;
    --deep: #7a1f3d;
    --cream: #fff5f8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
    color: var(--deep);
    background:
      radial-gradient(circle at 15% 10%, #ffd9e5 0, transparent 40%),
      radial-gradient(circle at 85% 90%, #ffe6d5 0, transparent 40%),
      var(--cream);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 16px;
    overflow-x: hidden;
  }

  /* ---------- Tiêu đề ---------- */
  header { text-align: center; margin-bottom: clamp(24px, 5vh, 48px); position: relative; z-index: 1; transition: opacity .8s; }
  h1 { font-family: 'Dancing Script', cursive; font-size: clamp(2.6rem, 7vw, 4.5rem); color: var(--pink); line-height: 1.1; }
  .sub { margin-top: 8px; font-size: clamp(.95rem, 2vw, 1.1rem); opacity: .75; }

  /* ---------- Lưới 3 - 3 - 2 ---------- */
  .grid {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: clamp(14px, 3vw, 28px);
    width: min(680px, 100%);
    transition: opacity .8s;
  }
  .card { grid-column: span 2; }
  .card:nth-child(7) { grid-column: 2 / span 2; }
  .card:nth-child(8) { grid-column: 4 / span 2; }

  /* ---------- Hộp quà ---------- */
  .card {
    position: relative;
    aspect-ratio: 1;
    border: none; cursor: pointer;
    border-radius: 22px;
    background: linear-gradient(145deg, var(--pink-2), var(--pink));
    box-shadow: 0 10px 24px rgba(255, 79, 129, .35), inset 0 -6px 0 rgba(0,0,0,.08);
    transition: transform .25s ease, box-shadow .25s ease, opacity .25s ease;
    overflow: hidden;
    font-family: inherit;
  }
  .card::before, .card::after { content: ''; position: absolute; background: rgba(255,255,255,.55); }
  .card::before { left: 50%; top: 0; bottom: 0; width: 14%; transform: translateX(-50%); }
  .card::after  { top: 50%; left: 0; right: 0; height: 14%; transform: translateY(-50%); }
  .num {
    position: absolute; inset: 0; margin: auto;
    width: 48%; height: 48%;
    border-radius: 50%;
    background: #fff; color: var(--pink);
    display: grid; place-items: center;
    font-size: clamp(1.8rem, 6vw, 3rem); font-weight: 800;
    z-index: 2;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
  }
  .card:hover { transform: translateY(-6px) rotate(-1.5deg); box-shadow: 0 16px 30px rgba(255,79,129,.45); }
  .card:focus-visible { outline: 4px solid var(--deep); outline-offset: 4px; }
  .card.opened { transform: scale(.95); opacity: .5; pointer-events: none; }
  .card.gone { pointer-events: none; animation: vanish 1.2s ease .3s both; }
  @keyframes vanish {
    0%   { opacity: .5; transform: scale(.95); filter: blur(0); }
    40%  { opacity: .6; transform: scale(1.05); }
    100% { opacity: 0;  transform: scale(.4) rotate(-10deg); filter: blur(8px); visibility: hidden; }
  }

  /* ---------- Trình phát video toàn màn hình ---------- */
  .player { position: fixed; inset: 0; z-index: 100; background: linear-gradient(145deg, var(--pink-2), var(--pink)); }
  .player[hidden] { display: none; }
  .stage { position: absolute; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  .stage video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .error { position: absolute; color: #fff; font-size: 1.2rem; }
  .close {
    position: absolute; top: 18px; right: 18px; z-index: 3;
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.9); color: var(--pink);
    font-size: 1.5rem; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
    transition: transform .2s;
  }
  .close:hover { transform: scale(1.1) rotate(90deg); }

  /* ---------- Màn hình kết thúc ---------- */
  .finale {
    position: fixed; inset: 0; z-index: 5;
    display: grid; place-items: center; text-align: center; padding: 24px;
    pointer-events: none; opacity: 0; transition: opacity 1.2s ease .4s;
  }
  .finale.show { opacity: 1; }
  .finale h2 { font-family: 'Dancing Script', cursive; font-size: clamp(2.6rem, 8vw, 5rem); color: var(--pink); }
  .finale p { margin-top: 12px; font-size: clamp(1rem, 2.4vw, 1.3rem); }
  body.done header, body.done .grid { opacity: 0; }

  /* ---------- Cánh hoa rơi ---------- */
  .petal {
    position: fixed; top: -40px; z-index: 0; pointer-events: none;
    background: linear-gradient(135deg, #ffc2d4, #ff8fab);
    border-radius: 150% 0 150% 0; opacity: .7;
    animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translate(var(--drift), 110vh) rotate(720deg); } }
</style>
</head>
<body>

<header>
  <h1>Chúc mừng 20/10</h1>
  <p class="sub">Chọn một hộp quà bất kỳ để mở lời chúc dành cho bạn 💝</p>
</header>

<main class="grid" id="grid"></main>

<div class="finale" id="finale">
  <div>
    <h2>Hết quà rồi! 💐</h2>
    <p>Chúc các chị em luôn xinh đẹp, hạnh phúc và thật nhiều niềm vui!</p>
  </div>
</div>

<div class="player" id="player" hidden>
  <div class="stage" id="stage">
    <video id="video" playsinline controls controlsList="nodownload nofullscreen" disablePictureInPicture></video>
    <p class="error" id="error" hidden>Không tải được video này 😢</p>
  </div>
  <button class="close" id="closeBtn" aria-label="Đóng video">✕</button>
</div>

<script>
  /* ====== CẤU HÌNH: đổi đường dẫn video tại đây (theo thứ tự ô 1 → 8) ====== */
  const VIDEOS = [
    'Video/1.mp4',
    'Video/2.mp4',
    'Video/3.mp4',
    'Video/4.mp4',
    'Video/5.mp4',
    'Video/6.mp4',
    'Video/7.mp4',
    'Video/8.mp4',
  ];

  // Tự thử các kiểu tên khác nếu không tìm thấy video (Video/videos, .mp4/.MP4)
  const NAME_STYLES = ['Video/{n}.mp4', 'Video/{n}.MP4', 'videos/{n}.mp4', 'videos/{n}.MP4'];
  document.getElementById('video').addEventListener('error', e => {
    const v = e.target;
    const src = v.getAttribute('src');
    const m = src && src.match(/(\d+)\.mp4$/i);
    if (!m) return;
    const tries = NAME_STYLES.map(s => s.replace('{n}', m[1]));
    const next = tries[tries.indexOf(src) + 1];
    if (next) {
      e.stopImmediatePropagation();
      v.src = next;
      v.play().catch(() => {});
    }
  });
  const AUTO_CLOSE_WHEN_ENDED = true; // true = video phát xong tự đóng
  /* ======================================================================== */

  const grid = document.getElementById('grid');
  const player = document.getElementById('player');
  const stage = document.getElementById('stage');
  const video = document.getElementById('video');
  const closeBtn = document.getElementById('closeBtn');
  const finale = document.getElementById('finale');
  const errorMsg = document.getElementById('error');

  let currentCard = null;
  let closing = false;
  let openedCount = 0;

  // Tạo 8 hộp quà
  VIDEOS.forEach((src, i) => {
    const card = document.createElement('button');
    card.className = 'card';
    card.setAttribute('aria-label', `Mở hộp quà số ${i + 1}`);
    card.innerHTML = `<span class="num">${i + 1}</span>`;
    card.addEventListener('click', () => openCard(card, src));
    grid.appendChild(card);
  });

  function openCard(card, src) {
    if (currentCard) return;
    currentCard = card;
    const r = card.getBoundingClientRect();
    card.classList.add('opened');

    errorMsg.hidden = true;
    video.src = src;
    player.hidden = false;

    // Vào toàn màn hình (phải gọi ngay trong lúc click)
    const fs = player.requestFullscreen || player.webkitRequestFullscreen;
    if (fs) {
      try { const p = fs.call(player); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    }

    // Hiệu ứng hộp quà phóng to thành màn hình video
    const W = innerWidth, H = innerHeight;
    const from = `inset(${r.top / H * 100}% ${(W - r.right) / W * 100}% ${(H - r.bottom) / H * 100}% ${r.left / W * 100}% round 22px)`;
    stage.animate(
      [{ clipPath: from }, { clipPath: 'inset(0% 0% 0% 0% round 0px)' }],
      { duration: 700, easing: 'cubic-bezier(.2,.8,.2,1)' }
    );
    player.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 });

    // Phát có âm thanh (được phép vì người dùng vừa click)
    video.play().catch(() => {});
  }

  function closePlayer() {
    if (!currentCard || closing) return;
    closing = true;
    video.pause();

    if (document.fullscreenElement || document.webkitFullscreenElement) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      try { const p = exit.call(document); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    }

    const anim = player.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, easing: 'ease' });
    anim.onfinish = () => {
      player.hidden = true;
      video.removeAttribute('src');
      video.load();

      const card = currentCard;
      card.classList.add('gone');   // hộp quà mờ dần rồi biến mất
      card.disabled = true;

      currentCard = null;
      closing = false;
      openedCount++;
      if (openedCount === VIDEOS.length) setTimeout(showFinale, 1600);
    };
  }

  function showFinale() {
    document.body.classList.add('done');
    finale.classList.add('show');
  }

  closeBtn.addEventListener('click', closePlayer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });

  // Thoát toàn màn hình bằng phím Esc cũng tính là tắt video
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
    document.addEventListener(ev, () => {
      if (!document.fullscreenElement && !document.webkitFullscreenElement && currentCard) closePlayer();
    })
  );

  video.addEventListener('ended', () => { if (AUTO_CLOSE_WHEN_ENDED) setTimeout(closePlayer, 600); });
  video.addEventListener('error', () => { if (video.getAttribute('src')) errorMsg.hidden = false; });

  // Cánh hoa rơi trang trí
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('span');
    p.className = 'petal';
    const s = 8 + Math.random() * 10;
    p.style.width = p.style.height = s + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.setProperty('--drift', (Math.random() * 200 - 100) + 'px');
    p.style.animationDuration = 8 + Math.random() * 10 + 's';
    p.style.animationDelay = -Math.random() * 18 + 's';
    document.body.appendChild(p);
  }
</script>
</body>
</html>
